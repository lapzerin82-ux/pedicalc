name: Build PediCalc Android APK

# GitHub-hosted runners have normal internet access (including
# dl.google.com), which the sandbox this project was built in does not —
# so this is where the APK actually gets compiled end-to-end. Push this
# repo to GitHub (or run this workflow manually) to get a real .apk.

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Sync web assets into the Android project
        run: npx cap copy android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pedicalc-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
